[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "{{cookiecutter.package_name}}"
version = "{{ cookiecutter.first_version }}"
description = {{ cookiecutter.project_short_description | tojson }}
readme = "README.md"
authors = [
  {name = "{{ cookiecutter.full_name | replace('\\', '\\\\') | replace('\"', '\\\"') }}", email = "{{cookiecutter.email}}"}
]
maintainers = [
  {name = "{{ cookiecutter.full_name | replace('\\', '\\\\') | replace('\"', '\\\"') }}", email = "{{cookiecutter.email}}"}
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Typing :: Typed",
]

dependencies = [
  "rich",
]
requires-python = "== 3.15"

[dependency-groups]
dev = [
    { include-group = "lint" },
    { include-group = "test" },
    { include-group = "typecheck" },
]
lint = [
    "ruff==0.17.3",
]
test = [
    "coverage==7.17.0",
    "pytest==9.2.0",
]
typecheck = [
    "ty==0.95.0",
]
docs = [
    "zensical==0.0.73",
]

[project.urls]
bugs = "https://github.com/{{cookiecutter.github_repo_owner}}/{{cookiecutter.package_name}}/issues"
changelog = "https://github.com/{{cookiecutter.github_repo_owner}}/{{cookiecutter.package_name}}/releases"
documentation = "https://{{ cookiecutter.github_repo_owner }}.github.io/{{ cookiecutter.package_name }}/"
homepage = "https://github.com/{{cookiecutter.github_repo_owner}}/{{cookiecutter.package_name}}"

[project.scripts]
{{cookiecutter.import_name}} = "{{cookiecutter.import_name}}.cli:app"

[tool.ty]
# All rules are enabled as "error" by default; no need to specify unless overriding.
# Example override: relax a rule for the entire project (uncomment if needed).
# rules.TY015 = "warn"  # For invalid-argument-type, warn instead of error.

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
]

[tool.coverage.run]
branch = true
parallel = true
source = ["src/", "tests/"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 90
exclude_also = [
    "if TYPE_CHECKING:",
    "if typing.TYPE_CHECKING:",
    "@overload",
    "@typing.overload",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
    "raise NotImplementedError",
    "\\.\\.\\.",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/{{ cookiecutter.import_name }}"]

[tool.uv]
package = true
default-groups = ["dev"]
